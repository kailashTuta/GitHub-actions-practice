# What is the goal of your workflow
# Goal: Whenever someone changes the python code
# The linter will check if the syntax, format, indentation (Linting) is correct ot not
name: Auto Linter

on:
  push: 
    paths: "*.py"
jobs:
  code:
    runs-on: ubuntu-latest
    # This step will automatically clone the code of the current branch into the runnera
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7
        
      - name: Install Linter
        run: pip install ruff
    
