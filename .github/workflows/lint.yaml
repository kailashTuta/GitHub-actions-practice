# What is the goal of your workflow
# Goal: Whenever someone changes the python code
# The linter will check if the syntax, format, indentation (Linting) is correct ot not
name: Auto Linter

on:
  push: 
    paths: "*.py"
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      # This step will automatically clone the code of the current branch into the runners
      - name: Checkout/Clone the code
        uses: actions/checkout@v7
      # This step will install the linting tool  
      - name: Install Linter
        run: pip install ruff
      # This step will run linter
      - name: Check the files for linting
        run: ruff check .
    
